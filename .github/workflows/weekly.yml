name: weekly-drone-brief

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python build_briefing.py

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-press-briefing
          path: |
            briefing.md
            briefing.json
